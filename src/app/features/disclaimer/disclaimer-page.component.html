<div class="disclaimer-page-wrapper">
<div class="container my-2">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card">
        <div class="card-body">
          <div
            *ngIf="showExpiredNotice"
            class="alert alert-warning mb-3"
            role="alert">
            SESSIONE SCADUTA! Per proseguire effettuare nuovamente l'accesso al sito
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0 text-primary fw-bold">Servizio distribuzione dati Rete MIR</h1>
           
          </div>

          <app-mir-disclaimer-terms class="mir-disclaimer-terms--contained" />

          <form [formGroup]="form" (ngSubmit)="enterSite()" class="d-flex flex-column gap-3">
            <div
              class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-lg-end gap-3">
              <button itButton="primary" type="submit" class="w-100 w-lg-auto">
                Entra nel sito
                <it-icon name="arrow-right" size="lg" color="white" class="ms-2"></it-icon>
              </button>
              <div class="flex-grow-1 min-w-0">
                <it-checkbox id="accepted" formControlName="accepted" label="Accetto i termini di utilizzo" [attr.aria-describedby]="submitted && form.get('accepted')?.invalid ? 'accepted-error' : null"></it-checkbox>
                <p id="accepted-error" class="text-danger small mb-0 mt-1" *ngIf="form.get('accepted')?.invalid && submitted" role="alert">
                  Per proseguire è necessario accettare i termini di utilizzo.
                </p>
              </div>
              <div class="flex-shrink-0">
                <button itButton="outline-primary" size="sm" type="button" (click)="downloadPdf()" class="w-100 w-lg-auto">
                  <it-icon name="file-pdf" size="sm" class="me-2"></it-icon>
                  Scarica PDF
                </button>
              </div>
            </div>

      
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
